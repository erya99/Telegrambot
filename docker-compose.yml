version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fbv_postgres
    environment:
      POSTGRES_DB: footballverse
      POSTGRES_USER: fbv_user
      POSTGRES_PASSWORD: changeme_strong_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbv_user -d footballverse"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fbv_redis
    command: redis-server --requirepass changeme_redis_password
    ports:
      - "6379:6379"

  bot:
    build: .
    container_name: fbv_bot
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  pgdata:
